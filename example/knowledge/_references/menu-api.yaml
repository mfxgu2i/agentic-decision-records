openapi: "3.0.3"
info:
  title: Sakura Cafe Menu API
  version: "1.0.0"
paths:
  /api/menu:
    get:
      summary: メニュー一覧を取得する
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [drink, food, seasonal]
      responses:
        "200":
          description: メニュー一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
components:
  schemas:
    MenuItem:
      type: object
      required: [id, name, category, price, imageUrl]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [drink, food, seasonal]
        price:
          type: integer
          description: 税込価格（円）
        imageUrl:
          type: string
          description: getMenuImageUrl() で変換済みのCDN URL
